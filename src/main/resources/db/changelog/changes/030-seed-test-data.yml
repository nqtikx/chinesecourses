  - changeSet:
      id: 030-seed-courses
      author: chinesecourses
      changes:
        - insert:
            tableName: course
            columns:
              - column: { name: name, value: "Базовый курс HSK1" }
              - column: { name: description, value: "Начальный курс китайского языка. Изучение основ фонетики, иероглифики и базовой грамматики." }
              - column: { name: archived, valueBoolean: false }
              - column: { name: created_at, valueComputed: "now()" }
        - insert:
            tableName: course
            columns:
              - column: { name: name, value: "Продвинутый курс HSK3" }
              - column: { name: description, value: "Углублённое изучение китайского языка для уровня HSK3. Разговорная практика и чтение." }
              - column: { name: archived, valueBoolean: false }
              - column: { name: created_at, valueComputed: "now()" }

  - changeSet:
      id: 030-seed-semesters
      author: chinesecourses
      changes:
        - sql:
            sql: >
              INSERT INTO semester (course_id, name, start_date, end_date, archived, created_at)
              VALUES (
                (SELECT id FROM course WHERE name='Базовый курс HSK1'),
                'Весна 2026', '2026-02-01', '2026-06-30', false, now()
              )
        - sql:
            sql: >
              INSERT INTO semester (course_id, name, start_date, end_date, archived, created_at)
              VALUES (
                (SELECT id FROM course WHERE name='Продвинутый курс HSK3'),
                'Весна 2026', '2026-02-01', '2026-06-30', false, now()
              )

  - changeSet:
