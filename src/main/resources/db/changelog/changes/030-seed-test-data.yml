            sql: >
              INSERT INTO study_group (semester_id, teacher_id, name, archived, created_at)
              VALUES (
                (SELECT s.id FROM semester s JOIN course c ON c.id=s.course_id WHERE c.name='Базовый курс HSK1' AND s.name='Весна 2026'),
                (SELECT id FROM person WHERE email='li.meilin@example.com'),
                'Группа A-1', false, now()
              )
        - sql:
