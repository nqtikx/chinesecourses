databaseChangeLog:
  - changeSet:
      id: 030-admin-user-add-person-link
      author: chinesecourses
      changes:
        - addColumn:
            tableName: admin_user
            columns:
              - column:
                  name: person_id
                  type: bigint

        - addForeignKeyConstraint:
            baseTableName: admin_user
            baseColumnNames: person_id
            referencedTableName: person
            referencedColumnNames: id
            constraintName: fk_admin_user_person
            onDelete: restrict

        - createIndex:
            tableName: admin_user
            indexName: ix_admin_user_person_id
            columns:
              - column:
                  name: person_id
