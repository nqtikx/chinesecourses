                  ('Группа A-2', 'zhang.wei@example.com', TIMESTAMPTZ '2026-02-17 11:00:00+03', TIMESTAMPTZ '2026-02-17 12:30:00+03', TIMESTAMPTZ '2026-02-17 11:00:00+03', TIMESTAMPTZ '2026-02-17 12:28:00+03', TIMESTAMPTZ '2026-02-17 12:45:00+03', TIMESTAMPTZ '2026-02-17 15:00:00+03', 'admin', 'Диалог в аэропорту', 'Ауд. 402', false, false),
