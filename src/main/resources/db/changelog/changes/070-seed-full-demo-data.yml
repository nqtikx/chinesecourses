                  ('Группа HSK3-C1', 'zhang.wei@example.com', TIMESTAMPTZ '2026-02-17 09:00:00+03', TIMESTAMPTZ '2026-02-17 10:30:00+03', TIMESTAMPTZ '2026-02-17 09:02:00+03', TIMESTAMPTZ '2026-02-17 10:32:00+03', TIMESTAMPTZ '2026-02-17 10:40:00+03', TIMESTAMPTZ '2026-02-17 12:30:00+03', 'admin', 'HSK3 грамматика: сложные конструкции', 'Ауд. 401', false, false),
                  ('Группа HSK3-C1', 'zhang.wei@example.com', TIMESTAMPTZ '2026-02-20 09:00:00+03', TIMESTAMPTZ '2026-02-20 10:30:00+03', NULL, NULL, NULL, NULL, NULL, 'Пробный тест HSK3', 'Ауд. 401', false, false)
              ) AS v(group_name, teacher_email, starts_at, ends_at, actual_starts_at, actual_ends_at, status_marked_at, status_approved_at, approver_username, topic, room, canceled, archived)
              JOIN study_group sg ON sg.name = v.group_name
              JOIN person teacher_person ON teacher_person.email = v.teacher_email
              LEFT JOIN admin_user approver ON approver.username = v.approver_username
