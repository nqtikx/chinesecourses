  - changeSet:
      id: 070-seed-extra-courses-semesters-groups
      author: chinesecourses
      changes:
        - sql:
            sql: |
              INSERT INTO course (name, description, archived, created_at)
              VALUES ('Технический китайский язык', 'Курс для студентов технических специальностей: терминология, документация, деловая переписка.', false, now())
              ON CONFLICT (name) DO NOTHING;

              INSERT INTO semester (course_id, name, start_date, end_date, archived, created_at)
              SELECT c.id, v.semester_name, v.start_date, v.end_date, false, now()
              FROM (
                VALUES
                  ('Базовый курс HSK1', 'Осень 2025', DATE '2025-09-15', DATE '2026-01-12'),
                  ('Продвинутый курс HSK3', 'Осень 2025', DATE '2025-09-15', DATE '2026-01-12'),
                  ('Технический китайский язык', 'Весна 2026', DATE '2026-02-01', DATE '2026-06-30')
              ) AS v(course_name, semester_name, start_date, end_date)
              JOIN course c ON c.name = v.course_name
              ON CONFLICT (course_id, name) DO NOTHING;

              INSERT INTO study_group (semester_id, teacher_id, name, schedule_notes, archived, created_at)
              SELECT s.id, t.id, v.group_name, v.schedule_notes, false, now()
              FROM (
                VALUES
                  ('Базовый курс HSK1', 'Весна 2026', 'Группа A-3', 'Детская группа: упор на разговорную практику.', 'chen.lin@example.com'),
                  ('Базовый курс HSK1', 'Осень 2025', 'Группа B-1', 'Архивная группа прошлого семестра.', 'li.meilin@example.com'),
                  ('Продвинутый курс HSK3', 'Осень 2025', 'Группа HSK3-B1', 'Архивная интенсивная группа HSK3.', 'zhang.wei@example.com'),
                  ('Продвинутый курс HSK3', 'Весна 2026', 'Группа HSK3-C1', 'Интенсив: чтение и устная практика.', 'zhang.wei@example.com'),
                  ('Технический китайский язык', 'Весна 2026', 'Группа T-1', 'Техническая лексика и профильные кейсы.', 'chen.lin@example.com')
              ) AS v(course_name, semester_name, group_name, schedule_notes, teacher_email)
              JOIN course c ON c.name = v.course_name
              JOIN semester s ON s.course_id = c.id AND s.name = v.semester_name
              JOIN person t ON t.email = v.teacher_email
              ON CONFLICT (semester_id, name) DO NOTHING;

  - changeSet:
      id: 070-seed-extra-enrollments
      author: chinesecourses
      changes:
        - sql:
            sql: |
              UPDATE enrollment e
              SET start_date = COALESCE(e.start_date, s.start_date),
                  contract_number = COALESCE(e.contract_number, 'CNT-2026-' || LPAD(e.id::text, 4, '0'))
              FROM semester s
              WHERE s.id = e.semester_id;

              INSERT INTO enrollment (student_id, payer_id, semester_id, group_id, status, level, start_date, end_date, contract_number, archived, created_at)
              SELECT p_student.id,
                     p_payer.id,
                     s.id,
                     sg.id,
                     v.status,
                     v.level,
                     v.start_date,
                     v.end_date,
                     v.contract_number,
                     false,
                     now()
              FROM (
                VALUES
                  ('ivanov.p@example.com', 'ivanov.p@example.com', 'Базовый курс HSK1', 'Осень 2025', 'Группа B-1', 'COMPLETED', 'HSK1', DATE '2025-09-15', DATE '2026-01-12', 'CNT-2025-0001'),
                  ('kozlova.a@example.com', 'kozlova.a@example.com', 'Базовый курс HSK1', 'Осень 2025', 'Группа B-1', 'COMPLETED', 'HSK1', DATE '2025-09-15', DATE '2026-01-12', 'CNT-2025-0002'),
                  ('petrova.m@example.com', 'petrova.m@example.com', 'Базовый курс HSK1', 'Осень 2025', 'Группа B-1', 'COMPLETED', 'HSK1', DATE '2025-09-15', DATE '2026-01-12', 'CNT-2025-0003'),
                  ('sidorov.a@example.com', 'sidorov.a@example.com', 'Продвинутый курс HSK3', 'Осень 2025', 'Группа HSK3-B1', 'COMPLETED', 'HSK3', DATE '2025-09-15', DATE '2026-01-12', 'CNT-2025-0004'),
                  ('smirnov.k@example.com', 'smirnova.ov@example.com', 'Базовый курс HSK1', 'Весна 2026', 'Группа A-3', 'ACTIVE', 'HSK1', DATE '2026-02-01', NULL, 'CNT-2026-0101'),
                  ('orlova.e@example.com', 'orlov.s@example.com', 'Базовый курс HSK1', 'Весна 2026', 'Группа A-3', 'ACTIVE', 'HSK1', DATE '2026-02-01', NULL, 'CNT-2026-0102'),
                  ('morozova.l@example.com', 'morozova.l@example.com', 'Технический китайский язык', 'Весна 2026', 'Группа T-1', 'ACTIVE', 'HSK3', DATE '2026-02-05', NULL, 'CNT-2026-0103'),
                  ('kim.yuna@example.com', 'kim.yuna@example.com', 'Технический китайский язык', 'Весна 2026', 'Группа T-1', 'ACTIVE', 'HSK3', DATE '2026-02-05', NULL, 'CNT-2026-0104'),
                  ('gromov.i@example.com', 'gromov.i@example.com', 'Продвинутый курс HSK3', 'Весна 2026', 'Группа HSK3-C1', 'ACTIVE', 'HSK3', DATE '2026-02-01', NULL, 'CNT-2026-0105')
              ) AS v(student_email, payer_email, course_name, semester_name, group_name, status, level, start_date, end_date, contract_number)
              JOIN person p_student ON p_student.email = v.student_email
              JOIN person p_payer ON p_payer.email = v.payer_email
              JOIN course c ON c.name = v.course_name
              JOIN semester s ON s.course_id = c.id AND s.name = v.semester_name
              JOIN study_group sg ON sg.semester_id = s.id AND sg.name = v.group_name
              WHERE NOT EXISTS (
                SELECT 1
                FROM enrollment e
                WHERE e.student_id = p_student.id
                  AND e.semester_id = s.id
                  AND e.archived = false
              );

  - changeSet:
      id: 070-seed-schedule-and-lessons
      author: chinesecourses
      changes:
        - sql:
            sql: |
              INSERT INTO group_schedule_rule (group_id, day_of_week, start_time, end_time, room, active, archived, created_at)
              SELECT sg.id, v.day_of_week, v.start_time, v.end_time, v.room, true, false, now()
              FROM (
                VALUES
                  ('Группа A-3', 1, TIME '16:00', TIME '17:30', 'Ауд. 210'),
                  ('Группа A-3', 3, TIME '16:00', TIME '17:30', 'Ауд. 210'),
                  ('Группа A-3', 6, TIME '10:00', TIME '11:30', 'Онлайн / Zoom'),
                  ('Группа T-1', 2, TIME '18:00', TIME '19:30', 'Ауд. 510'),
                  ('Группа T-1', 4, TIME '18:00', TIME '19:30', 'Ауд. 510'),
                  ('Группа HSK3-C1', 2, TIME '09:00', TIME '10:30', 'Ауд. 401'),
                  ('Группа HSK3-C1', 5, TIME '09:00', TIME '10:30', 'Ауд. 401')
              ) AS v(group_name, day_of_week, start_time, end_time, room)
              JOIN study_group sg ON sg.name = v.group_name
              WHERE NOT EXISTS (
                SELECT 1
                FROM group_schedule_rule gsr
                WHERE gsr.group_id = sg.id
                  AND gsr.day_of_week = v.day_of_week
                  AND gsr.start_time = v.start_time
                  AND gsr.end_time = v.end_time
                  AND gsr.archived = false
              );

