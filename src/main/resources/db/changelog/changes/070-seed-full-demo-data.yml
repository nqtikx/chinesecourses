              );

  - changeSet:
      id: 070-seed-attendance-journal
      author: chinesecourses
      changes:
        - sql:
            sql: |
              INSERT INTO attendance (lesson_session_id, enrollment_id, status, comment, marked_at, archived, created_at)
              SELECT ls.id, e.id, v.status, v.comment, now(), false, now()
              FROM (
                VALUES
                  ('Группа A-1', 'Еда и напитки', 'ivanov.p@example.com', 'PRESENT', NULL),
                  ('Группа A-1', 'Еда и напитки', 'kozlova.a@example.com', 'PRESENT', NULL),
                  ('Группа A-1', 'Еда и напитки', 'petrova.m@example.com', 'ABSENT', 'Семейные обстоятельства'),
                  ('Группа A-1', 'Покупки и деньги', 'ivanov.p@example.com', 'LATE', 'Опоздание на автобус'),
                  ('Группа A-1', 'Покупки и деньги', 'kozlova.a@example.com', 'PRESENT', NULL),
                  ('Группа A-1', 'Покупки и деньги', 'petrova.m@example.com', 'EXCUSED', 'Справка от педиатра'),
                  ('Группа A-2', 'Диалог в аэропорту', 'sidorov.a@example.com', 'PRESENT', NULL),
                  ('Группа A-3', 'Приветствие и знакомство', 'smirnov.k@example.com', 'PRESENT', NULL),
                  ('Группа A-3', 'Приветствие и знакомство', 'orlova.e@example.com', 'PRESENT', NULL),
                  ('Группа A-3', 'Чтение иероглифов', 'smirnov.k@example.com', 'LATE', 'Задержался после школы'),
                  ('Группа A-3', 'Чтение иероглифов', 'orlova.e@example.com', 'PRESENT', NULL),
                  ('Группа T-1', 'Техническая терминология: электроника', 'morozova.l@example.com', 'PRESENT', NULL),
                  ('Группа T-1', 'Техническая терминология: электроника', 'kim.yuna@example.com', 'PRESENT', NULL),
                  ('Группа T-1', 'Чтение технической документации', 'morozova.l@example.com', 'PRESENT', NULL),
                  ('Группа T-1', 'Чтение технической документации', 'kim.yuna@example.com', 'ABSENT', 'Командировка'),
                  ('Группа HSK3-C1', 'HSK3 грамматика: сложные конструкции', 'gromov.i@example.com', 'PRESENT', NULL)
              ) AS v(group_name, topic, student_email, status, comment)
              JOIN study_group sg ON sg.name = v.group_name
              JOIN lesson_session ls ON ls.group_id = sg.id AND ls.topic = v.topic
              JOIN person p ON p.email = v.student_email
              JOIN enrollment e ON e.student_id = p.id AND e.group_id = sg.id AND e.archived = false
              WHERE NOT EXISTS (
                SELECT 1
                FROM attendance a
                WHERE a.lesson_session_id = ls.id
                  AND a.enrollment_id = e.id
              );
