  - changeSet:
      id: 040-seed-attendance
      author: chinesecourses
      changes:
        # Посещаемость для первого занятия Группы A-1 (3 студента: Иванов, Козлова, Петрова)
        - sql:
            sql: >
              INSERT INTO attendance (lesson_session_id, enrollment_id, status, comment, marked_at, archived, created_at)
              VALUES (
                (SELECT ls.id FROM lesson_session ls WHERE ls.topic='Введение в китайский язык. Тоны' AND ls.group_id=(SELECT id FROM study_group WHERE name='Группа A-1')),
