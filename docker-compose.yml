services:
  postgres:
    image: postgres:14
    container_name: ${PROJECT_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - chinesecourses_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${SECURITY_JWT_SECRET}
      JWT_ISSUER: ${SECURITY_JWT_ISSUER}
      JWT_ACCESS_TTL: ${SECURITY_JWT_ACCESS_TOKEN_TTL}
    volumes:
      - chinesecourses_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT}:80"

volumes:
  chinesecourses_pgdata:
  chinesecourses_storage:
